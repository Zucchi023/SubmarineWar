<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>潜水艦あてゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== タイトル画面 ===== -->
  <section id="screen-title" class="screen active">
    <div class="title-box">
      <h1>潜水艦あてゲーム</h1>
      <p class="subtitle">6×6 の海に隠れた 4 隻の潜水艦を推理しよう</p>

      <div class="level-select">
        <span class="level-label">CPUの強さ</span>
        <div class="seg">
          <label><input type="radio" name="level" value="weak"><span>弱い</span></label>
          <label><input type="radio" name="level" value="normal" checked><span>普通</span></label>
          <label><input type="radio" name="level" value="strong"><span>強い</span></label>
        </div>
      </div>

      <button id="btn-start" class="btn primary big">CPUと対戦</button>
      <div class="title-links">
        <button id="btn-rules" class="btn link">あそびかた</button>
        <button id="btn-settings-title" class="btn link">設定</button>
      </div>
    </div>
  </section>

  <!-- ===== 配置フェーズ ===== -->
  <section id="screen-place" class="screen">
    <header class="topbar">
      <button id="btn-place-back" class="btn small">← 戻る</button>
      <div class="topbar-text">
        <h2>配置フェーズ</h2>
        <p class="hint">ドラッグ、またはタップで選んでマスをタップ。置いた船はタップで回転（船同士は縦横に隣接不可）</p>
      </div>
    </header>

    <div class="place-main">
      <div id="place-board-host"></div>
    </div>

    <!-- 未配置の船置き場（JSで生成） -->
    <div id="tray" class="tray"></div>

    <footer class="footer">
      <div class="footer-left">
        <button id="btn-reset" class="btn">リセット</button>
        <button id="btn-random" class="btn">ランダム</button>
      </div>
      <button id="btn-place-ok" class="btn primary" disabled>配置完了</button>
    </footer>
  </section>

  <!-- ===== 攻撃フェーズ ===== -->
  <section id="screen-attack" class="screen">
    <header class="topbar attack-top">
      <div id="turn-status">
        <span id="turn-label" class="turn-label"></span>
        <span id="turn-msg" class="turn-msg"></span>
      </div>
      <div class="top-actions">
        <button id="btn-settings" class="btn icon" aria-label="設定">⚙</button>
        <button id="btn-declare" class="btn declare">わかった！</button>
      </div>
    </header>

    <div class="attack-layout">
      <div class="main-col">
        <div class="panel-title">相手の盤面（予想）</div>
        <div id="guess-board-host"></div>
        <!-- メモ欄：船ごとの書き込み状況と「戻す」ボタン -->
        <div class="memo-row">
          <div id="progress" class="progress"></div>
          <button id="btn-undo" class="btn small">↶ 戻す</button>
        </div>
        <!-- 書き込みツール -->
        <div id="toolbar" class="toolbar">
          <button class="tool ask" data-tool="ask">質問</button>
          <button class="tool t2" data-tool="2">2</button>
          <button class="tool t3" data-tool="3">3</button>
          <button class="tool t4" data-tool="4">4</button>
          <button class="tool t5" data-tool="5">5</button>
          <button class="tool tx" data-tool="x">×</button>
          <button class="tool erase" data-tool="erase">消</button>
        </div>
      </div>

      <div class="side-col">
        <div class="mini-wrap">
          <div class="panel-title">自分の盤面</div>
          <div id="mini-board-host"></div>
        </div>
        <div class="info-col">
          <!-- 質問回数・ターン数 -->
          <div class="stats">
            <div id="stats-turn" class="stats-turn"></div>
            <div><span class="who-player">あなた</span><span id="stats-player"></span></div>
            <div><span class="who-cpu">CPU</span><span id="stats-cpu"></span></div>
          </div>
          <div class="log-wrap">
            <div class="panel-title">質問ログ</div>
            <!-- log-box の大きさはレイアウトで決まり、ログが増えても伸びない -->
            <div class="log-box">
              <ol id="log" class="log"></ol>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 判定フェーズ（結果） ===== -->
  <section id="screen-result" class="screen">
    <div class="result-head">
      <h2 id="result-title"></h2>
      <p id="result-sub"></p>
      <p id="result-stats" class="result-stats"></p>
    </div>
    <div class="result-boards">
      <div class="result-col">
        <div id="result-left-title" class="panel-title"></div>
        <div id="result-left"></div>
      </div>
      <div class="result-col">
        <div id="result-right-title" class="panel-title"></div>
        <div id="result-right"></div>
      </div>
    </div>
    <div class="result-buttons">
      <button id="btn-retry" class="btn primary">もう一度</button>
      <button id="btn-to-title" class="btn">タイトルへ</button>
    </div>
  </section>

  <!-- 「あなたのターン」の通知 -->
  <div id="turn-banner" class="turn-banner"></div>

  <!-- ===== 確認ダイアログ ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div id="modal-body"></div>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
